        <section class="contato-form">

            <p>Envie sua mensagem para nós:</p>

                <input type="text" required placeholder="Digite seu nome">

                <label>E-mail:</label>
                <input type="email" required placeholder="Digite seu email">

                <label>Mensagem:</label>
                <textarea rows="5" required placeholder="Sua mensagem..."></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
